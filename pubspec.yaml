name: campusbuzz
description: "CampusBuzz — The Operating System for Campus Culture. Show up. Earn rewards. Find your tribe."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0
  cloud_functions: ^6.4.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_app_check: ^0.4.7
  firebase_remote_config: ^6.6.0

  # Participation primitives
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  # UI
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.0
  fl_chart: ^1.2.0
  flutter_svg: ^2.0.10

  # Platform integrations
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  printing: ^5.15.0
  pdf: ^3.13.0

  # Utilities
  intl: ^0.20.3
  timezone: ^0.11.1
  uuid: ^4.6.0
  csv: ^8.0.0
  collection: ^1.19.0
  http: ^1.2.0
  meta: ^1.16.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.2.0
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
